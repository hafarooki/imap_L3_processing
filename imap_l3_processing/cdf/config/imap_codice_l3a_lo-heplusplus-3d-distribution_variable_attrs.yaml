support_data: &support_data
  VAR_TYPE: support_data
  RECORD_VARYING: NRV

float_data: &float_data
  DATA_TYPE: CDF_FLOAT
  FORMAT: F15.3
  VALIDMIN: 0
  VALIDMAX: 10000000000
  FILLVAL: -1.000000E+31

species_3d_distribution: &species_3d_distribution
  <<: *float_data
  UNITS: "#/(cm^2-s-sr-keV/q)"
  DISPLAY_TYPE: spectrogram
  RECORD_VARYING: RV
  SCALETYP: linear
  DEPEND_0: epoch
  DEPEND_1: energy
  DEPEND_2: spin_angle
  DEPEND_3: elevation
  LABL_PTR_1: energy_label
  LABL_PTR_2: spin_angle_label
  LABL_PTR_3: elevation_label

epoch:
  NAME: epoch
  CATDESC: Time, number of nanoseconds since J2000 with leap seconds included
  VAR_TYPE: support_data
  DATA_TYPE: CDF_TIME_TT2000
  FIELDNAM: Epoch
  RECORD_VARYING: RV
  FORMAT: ' '
  LABLAXIS: Epoch
  UNITS: ns
  VALIDMIN: 2010-01-01T00:00:00.000000000
  VALIDMAX: 2099-12-31T00:00:00.000000000
  FILLVAL: 9999-12-31T23:59:59.999999999
  SCALETYP: linear
  TIME_BASE: J2000
  TIME_SCALE: TT
  DELTA_PLUS_VAR: epoch_delta
  DELTA_MINUS_VAR: epoch_delta
  MONOTON: INCREASE
  REFERENCE_POSITION: Rotating Earth Geoid
  SI_CONVERSION: 1e-9>seconds

epoch_delta:
  NAME: epoch_delta
  CATDESC: Epoch delta
  FIELDNAM: Epoch Delta
  DATA_TYPE: CDF_INT8
  FORMAT: I15
  UNITS: ns
  VALIDMIN: 0
  VALIDMAX: 999999999999999
  FILLVAL: -9223372036854775808
  SCALETYP: linear
  LABLAXIS: Epoch delta
  DEPEND_0: epoch
  RECORD_VARYING: RV
  VAR_TYPE: support_data

elevation:
  <<: *support_data
  <<: *float_data
  NAME: elevation
  CATDESC: Elevation angle bins
  FIELDNAM: Elevation angle
  LABLAXIS: Elevation Angle
  UNITS: degrees
  SCALETYP: linear
  VALIDMIN: 0
  VALIDMAX: 180
  DELTA_PLUS_VAR: elevation_delta
  DELTA_MINUS_VAR: elevation_delta

elevation_delta:
  <<: *support_data
  <<: *float_data
  NAME: elevation_delta
  CATDESC: Elevation angle bin deltas
  FIELDNAM: Elevation angle delta
  LABLAXIS: Elevation Angle delta
  UNITS: degrees
  SCALETYP: linear

spin_angle:
  <<: *support_data
  <<: *float_data
  NAME: spin_angle
  CATDESC: Spin angle bins
  FIELDNAM: Spin angle
  LABLAXIS: Spin Angle
  UNITS: degrees
  VALIDMIN: 0
  VALIDMAX: 360
  SCALETYP: linear
  DELTA_PLUS_VAR: spin_angle_delta
  DELTA_MINUS_VAR: spin_angle_delta

spin_angle_delta:
  <<: *support_data
  <<: *float_data
  NAME: spin_angle_delta
  CATDESC: Spin angle bin deltas
  FIELDNAM: Spin angle delta
  LABLAXIS: Spin Angle delta
  UNITS: degrees
  SCALETYP: linear

energy:
  <<: *support_data
  <<: *float_data
  NAME: energy
  CATDESC: Energy bins
  FIELDNAM: Energy
  LABLAXIS: Energy
  UNITS: keV/e
  SCALETYP: log
  DELTA_PLUS_VAR: energy_delta_plus
  DELTA_MINUS_VAR: energy_delta_minus

energy_delta_plus:
  <<: *support_data
  <<: *float_data
  NAME: energy_delta_plus
  CATDESC: Energy bins delta plus
  FIELDNAM: Energy delta plus
  LABLAXIS: Energy delta plus
  UNITS: keV/e
  SCALETYP: log

energy_delta_minus:
  <<: *support_data
  <<: *float_data
  NAME: energy_delta_minus
  CATDESC: Energy bins delta minus
  FIELDNAM: Energy delta minus
  LABLAXIS: Energy delta minus
  UNITS: keV/e
  SCALETYP: log

heplusplus:
  <<: *species_3d_distribution
  NAME: heplusplus
  CATDESC: He++ Intensity 3d distribution
  FIELDNAM: He++ Intensity
  LABLAXIS: He++ Intensity
  DELTA_PLUS_VAR: heplusplus_stat_uncert
  DELTA_MINUS_VAR: heplusplus_stat_uncert
  VAR_TYPE: data
  VARIABLE_PURPOSE: PRIMARY_VAR,SUMMARY

heplusplus_stat_uncert:
  <<: *species_3d_distribution
  NAME: heplusplus_stat_uncert
  CATDESC: He++ Intensity 3d distribution statistical uncertainty
  FIELDNAM: He++ Intensity Statistical Uncertainty
  LABLAXIS: He++ Intensity Statistical Uncertainty
  VAR_TYPE: support_data

elevation_label:
  NAME: elevation_label
  CATDESC: Label for elevation
  FIELDNAM: Elevation label
  DATA_TYPE: CDF_CHAR
  FORMAT: a20
  VAR_TYPE: metadata
  FILLVAL: ' '

spin_angle_label:
  NAME: spin_angle_label
  CATDESC: Label for spin angle
  FIELDNAM: Spin angle label
  DATA_TYPE: CDF_CHAR
  FORMAT: a20
  VAR_TYPE: metadata
  FILLVAL: ' '

energy_label:
  NAME: energy_label
  CATDESC: Label for energy
  FIELDNAM: Energy label
  DATA_TYPE: CDF_CHAR
  FORMAT: a20
  VAR_TYPE: metadata
  FILLVAL: ' '

half_spin_per_esa_step:
  NAME: half_spin_per_esa_step
  CATDESC: Half spin number for each step of energy
  DEPEND_0: epoch
  DEPEND_1: energy
  DISPLAY_TYPE: spectrogram
  FIELDNAM: Half Spin Number
  DATA_TYPE: CDF_UINT1
  FILLVAL: 255
  FORMAT: I3
  LABLAXIS: Half Spin Number
  SCALETYP: linear
  UNITS: " "
  VALIDMIN: 0
  VALIDMAX: 31
  VAR_TYPE: support_data
  RECORD_VARYING: RV

rgfo_spin_sector:
  NAME: rgfo_spin_sector
  CATDESC: Spin Sector When Reduced Gain Factor Operation (RGFO) was activated
  DEPEND_0: epoch
  DISPLAY_TYPE: time_series
  FIELDNAM: RGFO Spin Sector
  DATA_TYPE: CDF_UINT1
  FILLVAL: 255
  FORMAT: I3
  LABLAXIS: RGFO Spin Sector
  SCALETYP: linear
  UNITS: " "
  VALIDMIN: 0
  VALIDMAX: 23
  VAR_NOTES: Indicates the spin sector when Reduced Gain Factor Operation (RGFO) was activated. In RGFO, the Entrance ESA voltage is reduced in order to limit the number of ions that reach the detectors.
  VAR_TYPE: support_data
  RECORD_VARYING: RV

rgfo_half_spin:
  NAME: rgfo_half_spin
  DEPEND_0: epoch
  RECORD_VARYING: RV
  DISPLAY_TYPE: time_series
  CATDESC: Half Spin When Reduced Gain Factor Operation (RGFO) was activated
  FIELDNAM: RGFO Half Spin
  DATA_TYPE: CDF_UINT1
  FILLVAL: 255
  FORMAT: I3
  LABLAXIS: RGFO Half Spin
  SCALETYP: linear
  UNITS: " "
  VALIDMAX: 31
  VALIDMIN: 0
  VAR_NOTES: Indicates the half spin when Reduced Gain Factor Operation (RGFO) was activated. In RGFO, the Entrance ESA voltage is reduced in order to limit the number of ions that reach the detectors.
  VAR_TYPE: support_data

rgfo_esa_step:
  NAME: rgfo_esa_step
  CATDESC: Energy Step When Reduced Gain Factor Operation (RGFO) was activated
  DEPEND_0: epoch
  DISPLAY_TYPE: time_series
  FIELDNAM: RGFO Energy Step
  DATA_TYPE: CDF_UINT1
  FILLVAL: 255
  FORMAT: I3
  LABLAXIS: RGFO Energy Step
  SCALETYP: linear
  UNITS: " "
  VALIDMIN: 0
  VALIDMAX: 127
  VAR_NOTES: Indicates the energy step when Reduced Gain Factor Operation (RGFO) was activated. In RGFO, the Entrance ESA voltage is reduced in order to limit the number of ions that reach the detectors.
  VAR_TYPE: support_data
  RECORD_VARYING: RV



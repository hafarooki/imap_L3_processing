lat_grid_label:
  NAME: lat_grid_label
  DATA_TYPE: CDF_CHAR
  CATDESC: Label for lat grid
  VAR_TYPE: metadata
  FIELDNAM: Latitude Grid Label
  FORMAT: a20
  FILLVAL: ' '
  UNITS: ' '
  RECORD_VARYING: NRV
uv_anisotropy_flag:
  NAME: uv_anisotropy_flag
  DATA_TYPE: CDF_INT2
  CATDESC: Source flag for UV anisotropy
  DEPEND_0: epoch
  VAR_TYPE: support_data
  FIELDNAM: UV Anisotropy Source
  FORMAT: I6
  LABLAXIS: UV anisotropy source
  VALIDMIN: -1
  VALIDMAX: 30000
  FILLVAL: -32768
  DISPLAY_TYPE: time_series
  SCALETYP: linear
  RECORD_VARYING: RV
  UNITS: ' '
  VAR_NOTES: >-
    Primarily for instrument team traceability. Details in release notes. Values:
    -1: Unspecified
    10000: Constant model
    20000: Pheomenological model
    20010: Pheomenological model 1
    20020: Pheomenological model 2
used_l3a:
  NAME: used_l3a
  DATA_TYPE: CDF_CHAR
  CATDESC: L3a files used
  VAR_TYPE: metadata
  FIELDNAM: Used L3a Files
  FORMAT: a50
  LABLAXIS: Used L3a
  FILLVAL: ' '
  DISPLAY_TYPE: no_plot
  RECORD_VARYING: RV
  UNITS: ' '
  DEPEND_0: epoch
glows_flags:
  NAME: glows_flags
  DATA_TYPE: CDF_UINT2
  CATDESC: "Quality flags for GLOWS L3b (caution required if nonzero)"
  DEPEND_0: epoch
  VAR_TYPE: data
  RECORD_VARYING: RV
  DISPLAY_TYPE: time_series
  SCALETYP: linear
  FIELDNAM: Quality Flags for GLOWS L3b
  FORMAT: I5
  UNITS: '0: okay; nonzero: caution'
  VALIDMIN: 0
  VALIDMAX: 65534
  FILLVAL: 65535
  LABLAXIS: Quality flags for GLOWS L3b
  VAR_NOTES: >-
    Each bit corresponds to a specific potential concern. See release notes for details.
    All bits are reserved for future use.

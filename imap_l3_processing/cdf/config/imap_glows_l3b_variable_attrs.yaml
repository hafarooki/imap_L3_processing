epoch:
  NAME: epoch
  DATA_TYPE: CDF_TIME_TT2000
  CATDESC: Time, number of nanoseconds since J2000 with leap seconds included for center of CR
  VAR_TYPE: support_data
  RECORD_VARYING: RV
  FIELDNAM: Epoch
  FORMAT: ' '
  LABLAXIS: Epoch
  UNITS: ns
  VALIDMIN: 2010-01-01T00:00:00.000000000
  VALIDMAX: 2099-12-31T00:00:00.000000000
  FILLVAL: 9999-12-31T23:59:59.999999999
  SCALETYP: linear
  TIME_BASE: J2000
  TIME_SCALE: TT
  DELTA_PLUS_VAR: epoch_delta
  DELTA_MINUS_VAR: epoch_delta
  MONOTON: INCREASE
  REFERENCE_POSITION: Rotating Earth Geoid
  SI_CONVERSION: 1e-9>seconds
epoch_delta:
  NAME: epoch_delta
  DATA_TYPE: CDF_INT8
  CATDESC: Time bin of half a carrington rotation
  DEPEND_0: epoch
  VAR_TYPE: support_data
  RECORD_VARYING: RV
  FIELDNAM: Epoch Delta
  FORMAT: I19
  LABLAXIS: Epoch delta
  UNITS: ns
  VALIDMIN: 0
  VALIDMAX: 2592000000000000
  FILLVAL: -9223372036854775808
  SCALETYP: linear
mean_time:
  NAME: mean_time
  DATA_TYPE: CDF_TIME_TT2000
  CATDESC: Mean time of lightcurve data, number of nanoseconds since J2000 with leap seconds
  DEPEND_0: epoch
  VAR_TYPE: support_data
  RECORD_VARYING: RV
  FIELDNAM: Mean Time
  FORMAT: ' '
  LABLAXIS: Mean Time
  UNITS: ns
  VALIDMIN: 2010-01-01T00:00:00.000000000
  VALIDMAX: 2099-12-31T00:00:00.000000000
  FILLVAL: 9999-12-31T23:59:59.999999999
  SCALETYP: linear
  TIME_BASE: J2000
  TIME_SCALE: TT
  MONOTON: INCREASE
  REFERENCE_POSITION: Rotating Earth Geoid
  SI_CONVERSION: 1e-9>seconds
cr:
  NAME: cr
  DATA_TYPE: CDF_INT2
  CATDESC: Carrington rotation number
  DEPEND_0: epoch
  VAR_TYPE: support_data
  RECORD_VARYING: RV
  FIELDNAM: Carrington Rotation
  FORMAT: I14
  LABLAXIS: Carrington rotation
  UNITS: ' '
  VALIDMIN: 2000
  VALIDMAX: 3000
  FILLVAL: -32768
  SCALETYP: linear
uv_anisotropy_factor:
  NAME: uv_anisotropy_factor
  DATA_TYPE: CDF_FLOAT
  CATDESC: UV anisotropy factor
  DEPEND_0: epoch
  DEPEND_1: lat_grid
  VAR_NOTES: "Calculated directly at the grid point; not integrated over space."
  VAR_TYPE: support_data
  RECORD_VARYING: RV
  FIELDNAM: UV Anisotropy Factor
  FORMAT: F9.3
  LABLAXIS: UV anisotropy factor
  UNITS: ' '
  VALIDMIN: 0
  VALIDMAX: 10
  FILLVAL: -1.00E+31
  SCALETYP: linear
  SCALEMIN: 0
  SCALEMAX: 10
lat_grid:
  NAME: lat_grid
  DATA_TYPE: CDF_FLOAT
  CATDESC: Latitudinal grid from -90 to 90
  VAR_TYPE: support_data
  RECORD_VARYING: NRV
  FIELDNAM: Latitude Grid
  FORMAT: F9.3
  LABLAXIS: Lat grid
  UNITS: degrees
  VALIDMIN: -90
  VALIDMAX: 90
  FILLVAL: -1.00E+31
  LABL_PTR_1: lat_grid_label
  SCALETYP: linear
sum_rate:
  NAME: sum_rate
  DATA_TYPE: CDF_FLOAT
  CATDESC: Averaged ionization rate profile obtained from lightcurve
  DEPEND_0: epoch
  DEPEND_1: lat_grid
  VAR_NOTES: "Calculated directly at the grid point; not integrated over space."
  VAR_TYPE: data
  RECORD_VARYING: RV
  DISPLAY_TYPE: spectrogram
  VARIABLE_PURPOSE: PRIMARY_VAR,SUMMARY
  FIELDNAM: Sum Rate
  FORMAT: F9.3
  LABLAXIS: Sum rate
  UNITS: s^-1
  VALIDMIN: 0
  VALIDMAX: 1.0
  FILLVAL: -1.00E+31
  SCALETYP: linear
  DELTA_PLUS_VAR: sum_uncert
  DELTA_MINUS_VAR: sum_uncert
  SCALEMIN: 0
  SCALEMAX: 1.0e-6

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "imap_l3_processing"
dynamic = ["version"]
description = "This is a package for creating IMAP Level 3 data"
requires-python = ">= 3.10"
dependencies = [
    "astropy==6.1.7",
    "astropy_healpix==1.1.2",
    "bitstring==4.3.0",
    "imap-data-access==0.42.0",
    "lmfit==1.3.3",
    "netCDF4>=1.6",
    "numdifftools==0.9.41",
    "numpy>=2.0.1,<2.4",
    "pandas==2.2.3",
    "requests==2.32.3",
    "sammi-cdf==1.0.0",
    "scikit-learn==1.6.1",
    "scipy>=1.13.1",
    "spacepy==0.7.0",
    "spiceypy==6.0.0",
    "uncertainties==3.2.2",
    "xarray==2025.3.1",
    "imap-processing>=1.0.35",
    "hatchling",
    "uv-dynamic-versioning",
    "numba>=0.65.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
]
dev = [
    "dotenv>=0.9.9",
    "pre-commit>=4.0",
    "ruff==0.15.2",
]

[tool.setuptools]
py-modules = ["imap_l3_processing"]

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
